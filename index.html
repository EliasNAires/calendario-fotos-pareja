<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Nuestros días</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <section id="entrada" class="entrada">
      <h1 class="entrada-titulo" data-album-name>Nuestros días</h1>
      <p class="entrada-demo" id="entrada-demo" hidden>Modo demo: fotos de mentira, nada sale de este navegador.</p>
      <button type="button" class="boton" id="entrar">Entrar con Google</button>
      <div class="entrada-sin-acceso" id="sin-acceso" role="alert" hidden>
        <p>Esta cuenta no tiene acceso al álbum.</p>
        <p class="entrada-email" id="sin-acceso-email"></p>
        <button type="button" class="boton" id="cambiar-cuenta">Cambiar de cuenta</button>
      </div>
      <p class="entrada-error" id="entrada-error" role="alert" hidden></p>
    </section>

    <main id="app" class="app" hidden>
      <p class="guardado" role="status" aria-live="polite"></p>
      <nav class="pestanas" aria-label="Secciones">
        <button type="button" class="pestana" data-vista="calendario" aria-current="page">Calendario</button>
        <button type="button" class="pestana" data-vista="lugares">Lugares</button>
      </nav>

      <section id="vista-calendario" aria-label="Calendario">
        <header class="cal-cabecera">
          <button type="button" class="cal-flecha" id="mes-anterior" aria-label="Mes anterior">‹</button>
          <h2 class="cal-titulo" id="mes-titulo" aria-live="polite"></h2>
          <button type="button" class="cal-flecha" id="mes-siguiente" aria-label="Mes siguiente">›</button>
        </header>
        <label class="cal-saltar">
          <span class="visually-hidden">Ir a un mes con fotos</span>
          <select id="mes-selector"></select>
        </label>
        <div class="cal-grilla" role="grid" aria-labelledby="mes-titulo">
          <div class="cal-semana cal-dias-semana" role="row">
            <abbr role="columnheader" title="lunes">L</abbr>
            <abbr role="columnheader" title="martes">M</abbr>
            <abbr role="columnheader" title="miércoles">M</abbr>
            <abbr role="columnheader" title="jueves">J</abbr>
            <abbr role="columnheader" title="viernes">V</abbr>
            <abbr role="columnheader" title="sábado">S</abbr>
            <abbr role="columnheader" title="domingo">D</abbr>
          </div>
          <div id="semanas"></div>
        </div>
      </section>

      <section id="vista-lugares" aria-label="Lugares" hidden>
        <ul class="lugares" id="lugares-lista"></ul>
      </section>

      <section id="vista-lugar" class="lugar" aria-labelledby="lugar-titulo" hidden>
        <button type="button" class="panel-cerrar" id="lugar-volver">‹ Lugares</button>
        <h2 class="lugar-titulo" id="lugar-titulo">
          <label id="lugar-nombre-campo">
            <span class="visually-hidden">Nombre del lugar</span>
            <input id="lugar-nombre" type="text" autocomplete="off" enterkeyhint="done" placeholder="Lugar sin nombre" />
          </label>
          <span id="lugar-sin-ubicacion">Sin ubicación</span>
        </h2>
        <p class="lugar-datos">
          <span id="lugar-resumen"></span>
          <a class="lugar-mapa" id="lugar-mapa" target="_blank" rel="noopener">Ver en Google Maps</a>
        </p>
        <div id="lugar-visitas"></div>
      </section>
    </main>

    <dialog id="panel-dia" class="panel" aria-labelledby="panel-titulo">
      <header class="panel-cabecera">
        <div class="panel-encabezado">
          <h2 class="panel-titulo" id="panel-titulo"></h2>
          <!-- Mientras el panel está abierto el resto de la página queda inerte: el estado se muestra también acá. -->
          <p class="guardado" role="status" aria-live="polite"></p>
        </div>
        <button type="button" class="panel-cerrar" id="panel-cerrar">Cerrar</button>
      </header>
      <label class="panel-nota">
        <span class="visually-hidden">Nota del día</span>
        <textarea id="panel-nota" rows="3" placeholder="Escribí algo de este día…"></textarea>
      </label>
      <div class="panel-fotos" id="panel-fotos"></div>
    </dialog>

    <dialog id="visor" class="visor" aria-labelledby="visor-hora">
      <header class="visor-cabecera">
        <div class="panel-encabezado">
          <h2 class="visor-hora" id="visor-hora"></h2>
          <p class="guardado" role="status" aria-live="polite"></p>
        </div>
        <button type="button" class="panel-cerrar" id="visor-cerrar">Cerrar</button>
      </header>
      <div class="visor-escenario" id="visor-escenario">
        <button type="button" class="visor-flecha" id="visor-anterior" aria-label="Foto anterior">‹</button>
        <div class="visor-marco">
          <img class="visor-imagen polaroid" id="visor-imagen" alt="" />
        </div>
        <button type="button" class="visor-flecha" id="visor-siguiente" aria-label="Foto siguiente">›</button>
      </div>
      <footer class="visor-pie">
        <a class="visor-lugar" id="visor-lugar" target="_blank" rel="noopener"></a>
        <label class="visor-caption">
          <span class="visually-hidden">Caption de la foto</span>
          <textarea id="visor-caption" rows="2" placeholder="Escribí algo de esta foto…"></textarea>
        </label>
      </footer>
    </dialog>

    <!-- Se venció la sesión con la app abierta: un toque y se sigue (lo escrito queda pendiente de guardar). -->
    <dialog id="reingreso" class="reingreso" aria-labelledby="reingreso-titulo">
      <h2 class="reingreso-titulo" id="reingreso-titulo">Se cerró la sesión</h2>
      <p>Entrá de nuevo para seguir. Lo que escribiste no se pierde.</p>
      <button type="button" class="boton" id="reingresar">Entrar con Google</button>
      <p class="entrada-error" id="reingreso-error" role="alert" hidden></p>
    </dialog>
  </body>
</html>
